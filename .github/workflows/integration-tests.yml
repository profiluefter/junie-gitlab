name: Junie Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    types: [ labeled, synchronize ]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    if: >-
      ${{
        !startsWith(github.ref, 'refs/heads/dependabot/') &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'pull_request_target' &&
           contains(github.event.pull_request.labels.*.name, 'run-integration'))
        )
      }}
    timeout-minutes: 45

    env:
      COMPOSE_FILE: docker-compose.test.yml
      JUNIE_API_KEY: ${{ secrets.JUNIE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'pull_request_target'
                && format('refs/pull/{0}/merge', github.event.pull_request.number)
                || github.ref }}
          allow-unsafe-pr-checkout: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build wrapper image from this branch
        run: docker build -t junie-gitlab-wrapper:test .

      - name: Start local GitLab stack
        run: docker compose -f "$COMPOSE_FILE" up -d

      - name: Bootstrap local GitLab
        run: ./scripts/bootstrap-local-gitlab.sh

      - name: Run integration tests
        id: run-tests
        run: npm run test:integration

      - name: Dump docker compose logs on failure
        if: failure()
        run: |
          mkdir -p test-results
          docker compose -f "$COMPOSE_FILE" logs --no-color gitlab gitlab-runner > test-results/compose-logs.txt || true
          docker compose -f "$COMPOSE_FILE" ps > test-results/compose-ps.txt || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          if-no-files-found: ignore
          path: ./test-results/
          retention-days: 7

      - name: Tear down local GitLab stack
        if: always()
        run: ./scripts/teardown-local-gitlab.sh
